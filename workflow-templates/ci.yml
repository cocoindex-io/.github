# The CocoIndex CI shape. Read CI.md in cocoindex-io/.github before changing
# the parts outside the `test` job: the conformance check requires them.
name: CI

on:
  pull_request:
    branches: [$default-branch]
    # `ready_for_review` starts CI when a draft is marked ready. `stacked`
    # starts it when a pull request joins a stack: its `opened` event can
    # arrive before the stack exists and miss the branch filter.
    types: [opened, synchronize, reopened, ready_for_review, stacked]
  merge_group:
  push:
    branches: [$default-branch]
  # A push that the merge queue already tested skips the full tier, so a
  # nightly run keeps the default branch's caches current.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI. Other runs get a group
# of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Drafts run no CI. Every job below needs this one, so all of them skip.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.mode.outputs.full }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      # The path filter diffs pushes and merge groups with git, and pull
      # requests through the API.
      - uses: actions/checkout@v5
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        with:
          fetch-depth: 1
      - id: mode
        uses: cocoindex-io/.github/actions/ci-mode@v1
      # A skipped filter leaves its outputs empty, and an empty output runs
      # the job: dispatched and scheduled runs test everything. So does a
      # stack's top layer: on a pull request the filter lists the files the
      # layer itself changed, but its run stands in for the whole stack.
      - id: filter
        if: >-
          steps.mode.outputs.full == 'true'
          && !github.event.pull_request.stack
          && contains(fromJSON('["pull_request", "push", "merge_group"]'), github.event_name)
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '.github/workflows/**'

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "Replace with the repository's build and tests."

  # The one check to require. Passes when every job above passed or was
  # skipped, and fails when one failed or was cancelled, or when `changes`
  # itself did not succeed (its skipped dependents would look like a pass).
  ci-gate:
    if: always() && github.event.pull_request.draft != true
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e '
            .changes.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")
          ' <<<"$RESULTS" >/dev/null
